services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: library_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/library.sql:/docker-entrypoint-initdb.d/01-library.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/library_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: root
      DB_PASSWORD: root123456
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
volumes:
  mysql_data:
